extends: existence
message: "'%s' opens with a vague pronoun; name the noun instead."
link: 'https://developers.google.com/tech-writing/one/words#recognize_ambiguous_pronouns'
level: suggestion
scope: sentence
# A sentence opening with a bare pronoun plus a verb is the case the course
# calls out: the referent sits in the previous sentence, so the reader guesses.
# These frames are excluded after measuring the rule on the courses themselves,
# where each produced a false positive. None of them has a referent to name:
#   'That is,' / 'That is:'     a discourse connective, "in other words"
#   'It is [often] helpful to'  an expletive subject; the adverb is optional
#   'It is clear that'          likewise
#   'It has been suggested'     expletive subject of a passive clause
tokens:
  - '^(?:This|That|These|Those)\s+(?:is|are|was|were|lets|means|allows|causes|makes|provides|requires|has|have)\b(?![,:])'
  - '^(?:It|They)\s+(?:lets|means|allows|causes|makes|provides|requires)\b'
  - '^(?:It|They)\s+(?:has|have)\b(?!\s+been\b)'
  # Only 'It is/was': 'They are <adjective>' is how a parallel list item reads
  # ("They are brief."), and the referent is the list's own lead-in sentence.
  - '^It\s+(?:is|was)\b(?!(?:\s+\w+){1,3}\s+(?:to|that)\b)'
