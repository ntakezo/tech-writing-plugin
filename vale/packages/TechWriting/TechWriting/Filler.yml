# 'in order to' is Google.WordListCase and the rest of the wordiness list is
# Microsoft.Wordiness; only 'in order for' is left uncovered.
extends: substitution
message: "Use '%s' instead of '%s'."
link: 'https://developers.google.com/tech-writing/one/short-sentences'
level: warning
ignorecase: true
action:
  name: replace
swap:
  in order for: for

tests:
  - name: fires
    input: |
      Set the flag in order for the cache to work.
    want: |
      1:14:TechWriting.Filler:Use 'for' instead of 'in order for'.
  - name: clean
    input: |
      Set the flag for the cache to work.
    want: ""
