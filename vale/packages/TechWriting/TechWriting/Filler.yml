# ai-tells.FillerPhrases carries 67 filler phrases, including "the fact that"
# and "has the ability to"; PlainLanguage takes "utilize", "is able to", "in
# the event that" and "at this point in time"; Google.WordListCase takes "in
# order to". Only "in order for" is left uncovered.
extends: substitution
message: "Use '%s' instead of '%s'."
link: 'https://developers.google.com/tech-writing/one/short-sentences'
level: warning
ignorecase: true
action:
  name: replace
swap:
  in order for: for

tests:
  - name: fires
    input: |
      Set the flag in order for the cache to work.
    want: |
      1:14:TechWriting.Filler:Use 'for' instead of 'in order for'.
  - name: clean
    input: |
      Set the flag so the cache works.
    want: ""
