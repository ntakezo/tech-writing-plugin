# PlainLanguage.DoubleNegatives handles 'not un...' and the legalese frames,
# but its negator list has no 'do not'/'don't', so this construction is missed.
extends: existence
message: "Rewrite '%s' without the double negative."
link: 'https://developers.google.com/tech-writing/error-messages/avoid-double-negatives'
level: warning
ignorecase: true
tokens:
  - "(?:don't|do not|never) fail to"

tests:
  - name: fires
    input: |
      Don't fail to unset the flag.
    want: |
      1:1:TechWriting.DoubleNegative:Rewrite 'Don't fail to' without the double negative.
  - name: clean
    input: |
      Unset the flag.
    want: ""
