# Vale configuration for the tech-writing plugin.
# `Google` is the official Vale implementation of the Google developer
# documentation style guide. `TechWriting` adds the rules from the courses that
# Google's package leaves unchecked: vague pronouns, weak verbs, filler,
# sentence length, missing alt text, and error-message tone.
# Run `vale sync` once to download both into StylesPath.

StylesPath = .vale-styles
MinAlertLevel = suggestion

Packages = Google, https://github.com/ntakezo/tech-writing-plugin/releases/latest/download/TechWriting.zip

[*.{md,mdx,txt,rst,adoc,html}]
BasedOnStyles = Vale, Google, TechWriting

# Prose inside source comments and docstrings.
[*.{go,ts,tsx,js,jsx,py,rs,java,rb,c,h,cc,cpp,sh}]
BasedOnStyles = Vale, Google, TechWriting
Google.Headings = NO
