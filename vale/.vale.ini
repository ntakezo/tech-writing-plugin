# Vale configuration for the tech-writing plugin. Two layers:
#
# Specification - the Google style guide and the course rules:
#   Google         the style guide itself (maintained by the Vale project)
#   GlobalEnglish  bare pronouns, idioms, noun stacks
#   PlainLanguage  double negatives, hidden verbs, sentence and paragraph length
#   Microcopy      error-message tone: blame, vagueness, harshness
#   A11y           alt text, heading order, table headers
#   TechWriting    the course rules none of the above covers
#
# AI tells - fingerprints of machine-written prose, advisory only:
#   ai-tells       downgraded to suggestion, with the rules that fight
#                  technical-documentation conventions switched off below
#
# Not enabled: write-good and proselint roughly double the alert count.
# Add them per project if you want the wider net.
#
# Run `vale sync` once to download everything into StylesPath.

StylesPath = .vale-styles
MinAlertLevel = suggestion

Packages = Google, GlobalEnglish, PlainLanguage, Microcopy, A11y, ai-tells, https://github.com/ntakezo/tech-writing-plugin/releases/latest/download/TechWriting.zip

[*.{md,mdx,txt,rst,adoc,html}]
BasedOnStyles = Vale, Google, GlobalEnglish, PlainLanguage, Microcopy, A11y, TechWriting, ai-tells

# ai-tells targets technical documentation, but it encodes a stricter house
# style than the Google guide on a few points. It advises rather than gates,
# and the rules below are off because following them would break the spec this
# plugin enforces, or because an enabled package already covers them.
ai-tells = suggestion

# Off: following these would contradict the Google courses.
#   FormalTransitions      bans "For example" and "For instance" among its 67
#                          connectives; 213 hits on the course text alone
#   Metacommentary         flags "**Note:**", the callout the guide itself uses
#   CataphoricForecasting  flags "The following three", the list lead-in the
#                          Lists and tables unit teaches
#   EmDashUsage            bans the em dash outright; Google permits it, and
#                          Google.EmDash polices only the spacing around it
#   FormalRegister         flags "implement", "implementation", "minimize"
#   FillerIntensifier      flags "a single", where singularity is often the
#                          point; 23 hits on the course text
ai-tells.FormalTransitions = NO
ai-tells.Metacommentary = NO
ai-tells.CataphoricForecasting = NO
ai-tells.EmDashUsage = NO
ai-tells.FormalRegister = NO
ai-tells.FillerIntensifier = NO

# Off: an enabled package reports the same thing.
#   ColonUsage   Google.Colons checks the same capital-after-colon and already
#                exempts the Note:/Caution:/Warning: labels
#   NounString   GlobalEnglish.NounStack and PlainLanguage.NounStack both fire
ai-tells.ColonUsage = NO
ai-tells.NounString = NO

# Prose inside source comments and docstrings.
[*.{go,ts,tsx,js,jsx,py,rs,java,rb,c,h,cc,cpp,sh}]
BasedOnStyles = Vale, Google, GlobalEnglish, PlainLanguage, TechWriting
Google.Headings = NO
