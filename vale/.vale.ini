# Vale configuration for the tech-writing plugin.
#
# Most of what the courses teach is already published as Vale packages, so this
# config leans on them instead of reimplementing their rules:
#   Google         the style guide itself (maintained by the Vale project)
#   GlobalEnglish  bare pronouns, idioms, noun stacks
#   PlainLanguage  double negatives, hidden verbs, sentence and paragraph length
#   Microcopy      error-message tone: blame, vagueness, harshness
#   A11y           alt text, heading order, table headers
#   TechWriting    the few course rules none of the above covers
#
# Not enabled by default: write-good and proselint roughly double the alert
# count. Add them per project if you want the wider net.
#
# Run `vale sync` once to download them into StylesPath.

StylesPath = .vale-styles
MinAlertLevel = suggestion

Packages = Google, GlobalEnglish, PlainLanguage, Microcopy, A11y, https://github.com/ntakezo/tech-writing-plugin/releases/latest/download/TechWriting.zip

[*.{md,mdx,txt,rst,adoc,html}]
BasedOnStyles = Vale, Google, GlobalEnglish, PlainLanguage, Microcopy, A11y, TechWriting

# Prose inside source comments and docstrings.
[*.{go,ts,tsx,js,jsx,py,rs,java,rb,c,h,cc,cpp,sh}]
BasedOnStyles = Vale, Google, GlobalEnglish, PlainLanguage, TechWriting
Google.Headings = NO
